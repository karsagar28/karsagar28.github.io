---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">{{ page.category | default: "Field note" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.reading_time %}<span aria-hidden="true">·</span><span>{{ page.reading_time }} min read</span>{% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% include giscus.html %}

  <footer class="post-footer">
    <a class="back-link" href="{{ '/' | relative_url }}">← All notes</a>
  </footer>
</article>
